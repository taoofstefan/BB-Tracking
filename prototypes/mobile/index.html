<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BB-Tracking Mobile Prototype</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef2f6;
      --ink: #19222d;
      --muted: #667484;
      --line: #cfd8e3;
      --panel: #ffffff;
      --blue: #1664c0;
      --green: #167455;
      --red: #b83030;
      --amber: #ad6b13;
      font-family: Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
    }

    main {
      min-height: 100vh;
      max-width: 520px;
      margin: 0 auto;
      background: var(--panel);
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    h1 {
      font-size: 18px;
      line-height: 1.2;
      margin: 0;
      letter-spacing: 0;
    }

    .status {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    .video-stage {
      position: relative;
      background: #101820;
      aspect-ratio: 9 / 16;
      width: 100%;
      max-height: 62vh;
      overflow: hidden;
      display: grid;
      place-items: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #101820;
    }

    .empty-stage {
      color: #d8e0e8;
      font-size: 14px;
      padding: 24px;
      text-align: center;
    }

    .marker {
      position: absolute;
      width: 28px;
      height: 28px;
      border: 2px solid #ffffff;
      border-radius: 50%;
      background: rgba(184, 48, 48, 0.78);
      transform: translate(-50%, -50%);
      pointer-events: none;
      display: none;
    }

    .path {
      position: absolute;
      width: 3px;
      height: 42%;
      top: 29%;
      left: 52%;
      background: var(--red);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.8);
      opacity: 0.85;
      display: none;
    }

    .controls {
      padding: 12px 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      border-bottom: 1px solid var(--line);
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
    }

    input,
    select,
    button {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #ffffff;
      color: var(--ink);
      font-size: 15px;
      padding: 8px 10px;
    }

    button {
      background: var(--blue);
      border-color: var(--blue);
      color: #ffffff;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary {
      background: #ffffff;
      color: var(--blue);
    }

    input[type="file"] {
      display: none;
    }

    .file-button {
      min-height: 42px;
      border: 1px solid var(--blue);
      border-radius: 6px;
      background: var(--blue);
      color: #ffffff;
      font-size: 15px;
      padding: 10px;
      text-align: center;
      text-transform: none;
      cursor: pointer;
    }

    .file-name {
      min-height: 18px;
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .summary {
      padding: 14px 16px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      min-height: 72px;
    }

    .metric .name {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      font-weight: 700;
    }

    .metric .value {
      margin-top: 6px;
      font-size: 24px;
      font-weight: 700;
    }

    .charts {
      padding: 0 16px 16px;
      display: grid;
      gap: 10px;
    }

    .chart-panel {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      min-height: 150px;
    }

    .chart-title {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .chart {
      min-height: 110px;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 13px;
    }

    .chart svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .rep-list {
      padding: 0 16px 16px;
      display: grid;
      gap: 8px;
    }

    .rep {
      display: grid;
      grid-template-columns: 54px 1fr 76px;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      font-size: 14px;
    }

    .bar {
      height: 8px;
      background: #e5ebf2;
      border-radius: 999px;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      background: var(--green);
    }

    .loss {
      text-align: right;
      color: var(--amber);
      font-weight: 700;
    }

    .error {
      color: var(--red);
    }
  </style>
</head>
<body>
<main>
  <header>
    <h1>BB-Tracking</h1>
    <div class="status" id="status">Prototype</div>
  </header>

  <section class="video-stage" id="videoStage">
    <video id="video" controls playsinline hidden></video>
    <div class="empty-stage" id="emptyStage">No video selected</div>
    <div class="path" id="path"></div>
    <div class="marker" id="marker"></div>
  </section>

  <section class="controls">
    <div class="field">
      <label for="videoInput">Video</label>
      <input id="videoInput" type="file" accept="video/*">
      <label class="file-button" for="videoInput">Import</label>
      <div class="file-name" id="fileName">No file</div>
    </div>
    <div class="field">
      <label for="analysisInput">Analysis</label>
      <input id="analysisInput" type="file" accept="application/json,.json">
      <label class="file-button" for="analysisInput">Load JSON</label>
      <div class="file-name" id="analysisName">No data</div>
    </div>
    <div class="field">
      <label for="exercise">Exercise</label>
      <select id="exercise">
        <option>Squat</option>
        <option>Bench press</option>
        <option>Deadlift</option>
        <option>Overhead press</option>
      </select>
    </div>
    <button id="analyzeButton">Analyze</button>
    <button class="secondary" id="resetButton">Reset</button>
  </section>

  <section class="summary">
    <div class="metric"><div class="name">Reps</div><div class="value" id="reps">--</div></div>
    <div class="metric"><div class="name">Peak</div><div class="value" id="peak">--</div></div>
    <div class="metric"><div class="name">Avg</div><div class="value" id="average">--</div></div>
    <div class="metric"><div class="name">Slowdown</div><div class="value" id="slowdown">--</div></div>
  </section>

  <section class="summary">
    <div class="metric"><div class="name">Max Drift</div><div class="value" id="maxDrift">--</div></div>
    <div class="metric"><div class="name">Avg Drift</div><div class="value" id="avgDrift">--</div></div>
    <div class="metric"><div class="name">ROM CV</div><div class="value" id="romCv">--</div></div>
    <div class="metric"><div class="name">Sticking</div><div class="value" id="sticking">--</div></div>
  </section>

  <section class="charts">
    <div class="chart-panel">
      <div class="chart-title">Velocity</div>
      <div class="chart" id="velocityChart">Load analysis JSON</div>
    </div>
    <div class="chart-panel">
      <div class="chart-title">Bar Path</div>
      <div class="chart" id="pathChart">Load analysis JSON</div>
    </div>
  </section>

  <section class="rep-list" id="repList"></section>
</main>

<script>
  const videoInput = document.getElementById("videoInput");
  const analysisInput = document.getElementById("analysisInput");
  const video = document.getElementById("video");
  const emptyStage = document.getElementById("emptyStage");
  const videoStage = document.getElementById("videoStage");
  const marker = document.getElementById("marker");
  const path = document.getElementById("path");
  const status = document.getElementById("status");
  const analyzeButton = document.getElementById("analyzeButton");
  const resetButton = document.getElementById("resetButton");
  const repList = document.getElementById("repList");
  const fileName = document.getElementById("fileName");
  const analysisName = document.getElementById("analysisName");
  const velocityChart = document.getElementById("velocityChart");
  const pathChart = document.getElementById("pathChart");

  let videoUrl = null;

  videoInput.addEventListener("change", () => {
    const file = videoInput.files[0];
    if (!file) return;
    if (videoUrl) URL.revokeObjectURL(videoUrl);
    videoUrl = URL.createObjectURL(file);
    fileName.textContent = file.name;
    video.src = videoUrl;
    video.hidden = false;
    emptyStage.hidden = true;
    status.textContent = "Video loaded";
  });

  analysisInput.addEventListener("change", async () => {
    const file = analysisInput.files[0];
    if (!file) return;
    try {
      const payload = JSON.parse(await file.text());
      renderAnalysis(payload);
      analysisName.textContent = file.name;
      analysisName.classList.remove("error");
      status.textContent = "Analysis loaded";
    } catch (error) {
      analysisName.textContent = "Invalid JSON";
      analysisName.classList.add("error");
      status.textContent = "Analysis failed";
    }
  });

  videoStage.addEventListener("click", (event) => {
    const rect = videoStage.getBoundingClientRect();
    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;
    marker.style.left = `${x}px`;
    marker.style.top = `${y}px`;
    marker.style.display = "block";
    path.style.left = `${x + 8}px`;
    path.style.display = "block";
    status.textContent = "Bar selected";
  });

  analyzeButton.addEventListener("click", () => {
    renderAnalysis({
      summary: {
        rep_count: 5,
        max_speed_m_s: 0.82,
        avg_speed_m_s: 0.54
      },
      quality: {
        max_horizontal_drift_px: 18.4,
        avg_horizontal_drift_px: 9.2,
        rom_consistency_cv: 0.14,
        sticking_rep_index: 4,
        sticking_time_s: 8.35
      },
      frames: [0, 1, 2, 3, 4, 5, 6].map((step) => ({
        time_s: step * 0.2,
        speed_m_s: [0.1, 0.45, 0.62, 0.58, 0.38, 0.25, 0.2][step],
        center_x: [110, 112, 113, 116, 118, 119, 121][step],
        center_y: [230, 210, 185, 160, 150, 170, 205][step]
      })),
      reps: [0, 4, 9, 13, 18].map((loss, index) => ({
        index: index + 1,
        mean_speed_m_s: 0.62 - index * 0.05,
        velocity_loss_pct: loss
      }))
    });
    status.textContent = "Analysis preview";
  });

  resetButton.addEventListener("click", () => {
    marker.style.display = "none";
    path.style.display = "none";
    clearRepList();
    clearCharts("Load analysis JSON");
    for (const id of ["reps", "peak", "average", "slowdown", "maxDrift", "avgDrift", "romCv", "sticking"]) {
      document.getElementById(id).textContent = "--";
    }
    status.textContent = video.hidden ? "Prototype" : "Video loaded";
  });

  if (new URLSearchParams(window.location.search).get("demo") === "1") {
    analyzeButton.click();
  }

  function renderAnalysis(payload) {
    const summary = payload.summary || {};
    const reps = Array.isArray(payload.reps) ? payload.reps : [];
    const frames = Array.isArray(payload.frames) ? payload.frames : [];
    const velocityLoss = reps
      .map((rep) => Number(rep.velocity_loss_pct))
      .filter((value) => Number.isFinite(value));
    const maxLoss = velocityLoss.length ? Math.max(...velocityLoss) : null;

    document.getElementById("reps").textContent = formatCount(summary.rep_count ?? reps.length);
    document.getElementById("peak").textContent = formatSpeed(summary.max_speed_m_s, summary.max_speed_px_s);
    document.getElementById("average").textContent = formatSpeed(summary.avg_speed_m_s, summary.avg_speed_px_s);
    document.getElementById("slowdown").textContent = formatPercent(maxLoss);
    renderQuality(payload.quality || {});
    renderReps(reps);
    renderCharts(frames);
  }

  function renderQuality(quality) {
    document.getElementById("maxDrift").textContent = formatPixels(quality.max_horizontal_drift_px);
    document.getElementById("avgDrift").textContent = formatPixels(quality.avg_horizontal_drift_px);
    document.getElementById("romCv").textContent = formatRatioPercent(quality.rom_consistency_cv);
    document.getElementById("sticking").textContent = formatSticking(quality);
  }

  function renderReps(reps) {
    clearRepList();
    for (const rep of reps) {
      const loss = Number(rep.velocity_loss_pct);
      const displayLoss = Number.isFinite(loss) ? loss : 0;
      const fill = Math.max(30, 100 - displayLoss * 3);
      const row = document.createElement("div");
      row.className = "rep";

      const title = document.createElement("strong");
      title.textContent = `Rep ${formatCount(rep.index)}`;

      const bar = document.createElement("div");
      bar.className = "bar";
      const fillEl = document.createElement("div");
      fillEl.className = "fill";
      fillEl.style.width = `${fill}%`;
      bar.appendChild(fillEl);

      const lossEl = document.createElement("div");
      lossEl.className = "loss";
      lossEl.textContent = formatPercent(rep.velocity_loss_pct);

      row.append(title, bar, lossEl);
      repList.appendChild(row);
    }
  }

  function clearRepList() {
    while (repList.firstChild) {
      repList.removeChild(repList.firstChild);
    }
  }

  function renderCharts(frames) {
    const velocityPoints = frames
      .map((frame) => [Number(frame.time_s), Number(frame.speed_m_s ?? frame.speed_px_s)])
      .filter(([x, y]) => Number.isFinite(x) && Number.isFinite(y));
    const pathPoints = frames
      .map((frame) => [Number(frame.center_x), Number(frame.center_y)])
      .filter(([x, y]) => Number.isFinite(x) && Number.isFinite(y));

    renderLineChart(velocityChart, velocityPoints, "No velocity data", "var(--blue)", true);
    renderLineChart(pathChart, pathPoints, "No bar path data", "var(--red)", false);
  }

  function renderLineChart(container, points, emptyLabel, stroke, invertY) {
    clearElement(container);
    if (points.length < 2) {
      container.textContent = emptyLabel;
      return;
    }

    const width = 320;
    const height = 120;
    const padding = 10;
    const xs = points.map(([x]) => x);
    const ys = points.map(([, y]) => y);
    const minX = Math.min(...xs);
    const maxX = Math.max(...xs);
    const minY = Math.min(...ys);
    const maxY = Math.max(...ys);
    const xRange = Math.max(maxX - minX, 1);
    const yRange = Math.max(maxY - minY, 1);
    const scaledPoints = points.map(([x, y]) => {
      const scaledX = padding + ((x - minX) / xRange) * (width - padding * 2);
      let yPosition = (y - minY) / yRange;
      if (invertY) yPosition = 1 - yPosition;
      const scaledY = padding + yPosition * (height - padding * 2);
      return `${scaledX.toFixed(1)},${scaledY.toFixed(1)}`;
    });

    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
    svg.setAttribute("role", "img");
    const polyline = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
    polyline.setAttribute("points", scaledPoints.join(" "));
    polyline.setAttribute("fill", "none");
    polyline.setAttribute("stroke", stroke);
    polyline.setAttribute("stroke-width", "3");
    polyline.setAttribute("stroke-linecap", "round");
    polyline.setAttribute("stroke-linejoin", "round");
    svg.appendChild(polyline);
    container.appendChild(svg);
  }

  function clearCharts(label) {
    for (const chart of [velocityChart, pathChart]) {
      clearElement(chart);
      chart.textContent = label;
    }
  }

  function clearElement(element) {
    while (element.firstChild) {
      element.removeChild(element.firstChild);
    }
  }

  function formatCount(value) {
    return Number.isFinite(Number(value)) ? String(Number(value)) : "--";
  }

  function formatPercent(value) {
    return Number.isFinite(Number(value)) ? `${Number(value).toFixed(0)}%` : "--";
  }

  function formatRatioPercent(value) {
    return Number.isFinite(Number(value)) ? `${(Number(value) * 100).toFixed(1)}%` : "--";
  }

  function formatPixels(value) {
    return Number.isFinite(Number(value)) ? `${Number(value).toFixed(1)} px` : "--";
  }

  function formatSticking(quality) {
    if (quality.sticking_rep_index == null || quality.sticking_time_s == null) {
      return "--";
    }
    const repIndex = Number(quality.sticking_rep_index);
    const time = Number(quality.sticking_time_s);
    if (!Number.isFinite(repIndex) || !Number.isFinite(time)) {
      return "--";
    }
    return `Rep ${repIndex} @ ${time.toFixed(2)}s`;
  }

  function formatSpeed(metersPerSecond, pixelsPerSecond) {
    if (Number.isFinite(Number(metersPerSecond))) {
      return Number(metersPerSecond).toFixed(2);
    }
    if (Number.isFinite(Number(pixelsPerSecond))) {
      return Number(pixelsPerSecond).toFixed(0);
    }
    return "--";
  }
</script>
</body>
</html>
