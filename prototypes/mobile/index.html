<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BB-Tracking Mobile Prototype</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef2f6;
      --ink: #19222d;
      --muted: #667484;
      --line: #cfd8e3;
      --panel: #ffffff;
      --blue: #1664c0;
      --green: #167455;
      --red: #b83030;
      --amber: #ad6b13;
      font-family: Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
    }

    main {
      min-height: 100vh;
      max-width: 520px;
      margin: 0 auto;
      background: var(--panel);
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    h1 {
      font-size: 18px;
      line-height: 1.2;
      margin: 0;
      letter-spacing: 0;
    }

    .status {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    .video-stage {
      position: relative;
      background: #101820;
      aspect-ratio: 9 / 16;
      width: 100%;
      max-height: 62vh;
      overflow: hidden;
      display: grid;
      place-items: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #101820;
    }

    .empty-stage {
      color: #d8e0e8;
      font-size: 14px;
      padding: 24px;
      text-align: center;
    }

    .marker {
      position: absolute;
      width: 28px;
      height: 28px;
      border: 2px solid #ffffff;
      border-radius: 50%;
      background: rgba(184, 48, 48, 0.78);
      transform: translate(-50%, -50%);
      pointer-events: none;
      display: none;
    }

    .calib-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: none;
    }

    .calib-handle {
      fill: #ffffff;
      stroke: var(--blue);
      stroke-width: 2;
    }

    .calib-line {
      stroke: #ffffff;
      stroke-width: 2;
      stroke-dasharray: 4 3;
    }

    .video-stage.calibrating {
      cursor: crosshair;
      outline: 2px dashed rgba(22, 100, 192, 0.6);
      outline-offset: -2px;
    }

    .path {
      position: absolute;
      width: 3px;
      height: 42%;
      top: 29%;
      left: 52%;
      background: var(--red);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.8);
      opacity: 0.85;
      display: none;
    }

    .controls {
      padding: 12px 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      border-bottom: 1px solid var(--line);
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .picker-button {
      width: 100%;
      min-height: 38px;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .wide {
      grid-column: 1 / -1;
    }

    .service-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 104px;
      gap: 10px;
    }

    label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
    }

    input,
    select,
    button {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #ffffff;
      color: var(--ink);
      font-size: 15px;
      padding: 8px 10px;
    }

    button {
      background: var(--blue);
      border-color: var(--blue);
      color: #ffffff;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary {
      background: #ffffff;
      color: var(--blue);
    }

    input[type="file"] {
      display: none;
    }

    .file-button {
      min-height: 42px;
      border: 1px solid var(--blue);
      border-radius: 6px;
      background: var(--blue);
      color: #ffffff;
      font-size: 15px;
      padding: 10px;
      text-align: center;
      text-transform: none;
      cursor: pointer;
    }

    .file-name {
      min-height: 18px;
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .summary {
      padding: 14px 16px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      min-height: 72px;
    }

    .metric .name {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      font-weight: 700;
    }

    .metric .value {
      margin-top: 6px;
      font-size: 24px;
      font-weight: 700;
    }

    .charts {
      padding: 0 16px 16px;
      display: grid;
      gap: 10px;
    }

    .chart-panel {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      min-height: 150px;
    }

    .chart-title {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .chart {
      min-height: 110px;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 13px;
    }

    .chart svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .rep-list {
      padding: 0 16px 16px;
      display: grid;
      gap: 8px;
    }

    .rep {
      display: grid;
      grid-template-columns: 54px 1fr auto;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      font-size: 14px;
    }

    .bar {
      height: 8px;
      background: #e5ebf2;
      border-radius: 999px;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      background: var(--green);
    }

    .rep-end {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .loss {
      text-align: right;
      color: var(--amber);
      font-weight: 700;
      min-width: 36px;
    }

    .rep-control {
      min-height: 0;
      width: 30px;
      height: 30px;
      min-width: 30px;
      padding: 0;
      font-size: 14px;
      line-height: 1;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .rep-control[disabled] {
      background: #e5ebf2;
      border-color: var(--line);
      color: var(--muted);
      cursor: not-allowed;
      opacity: 1;
    }

    .error {
      color: var(--red);
    }
  </style>
</head>
<body>
<main>
  <header>
    <h1>BB-Tracking</h1>
    <div class="status" id="status">Prototype</div>
  </header>

  <section class="video-stage" id="videoStage">
    <video id="video" controls playsinline hidden></video>
    <div class="empty-stage" id="emptyStage">No video selected</div>
    <div class="path" id="path"></div>
    <div class="marker" id="marker"></div>
    <svg class="calib-svg" id="calibSvg" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <line class="calib-line" id="calibLine" x1="0" y1="0" x2="0" y2="0"></line>
      <circle class="calib-handle" id="calibA" cx="0" cy="0" r="7"></circle>
      <circle class="calib-handle" id="calibB" cx="0" cy="0" r="7"></circle>
    </svg>
  </section>

  <section class="controls">
    <div class="field">
      <label for="videoInput">Video</label>
      <input id="videoInput" type="file" accept="video/*">
      <label class="file-button" for="videoInput">Import</label>
      <div class="file-name" id="fileName">No file</div>
    </div>
    <div class="field">
      <label for="analysisInput">Analysis</label>
      <input id="analysisInput" type="file" accept="application/json,.json">
      <label class="file-button" for="analysisInput">Load JSON</label>
      <div class="file-name" id="analysisName">No data</div>
    </div>
    <div class="field">
      <label for="exercise">Exercise</label>
      <select id="exercise">
        <option>Squat</option>
        <option>Bench press</option>
        <option>Deadlift</option>
        <option>Overhead press</option>
      </select>
    </div>
    <div class="field wide">
      <label for="serviceUrl">Service</label>
      <div class="service-row">
        <input id="serviceUrl" type="url" value="http://127.0.0.1:8000">
        <button class="secondary" id="serviceCheckButton" type="button">Check</button>
      </div>
      <div class="file-name" id="serviceStatus">Not checked</div>
    </div>
    <div class="field wide">
      <label for="roiInput">ROI</label>
      <input id="roiInput" type="text" value="300,120,80,40">
    </div>
    <div class="field">
      <label for="scaleInput">Scale (px/m)</label>
      <input id="scaleInput" type="number" min="0.01" step="any" value="100" inputmode="decimal">
    </div>
    <div class="field">
      <label for="trackerSelect">Tracker</label>
      <select id="trackerSelect">
        <option value="mosse">MOSSE</option>
        <option value="kcf">KCF</option>
        <option value="csrt">CSRT</option>
      </select>
    </div>
    <div class="field">
      <label for="referencePxInput">Reference px</label>
      <input id="referencePxInput" type="number" min="0.01" step="any" inputmode="decimal" placeholder="optional">
    </div>
    <div class="field">
      <label for="referenceMInput">Reference m</label>
      <input id="referenceMInput" type="number" min="0.01" step="any" inputmode="decimal" placeholder="optional">
    </div>
    <button class="secondary picker-button wide" id="calibPickButton" type="button">Pick Reference</button>
    <button id="analyzeButton">Analyze</button>
    <button class="secondary" id="resetButton">Reset</button>
  </section>

  <section class="summary">
    <div class="metric"><div class="name">Reps</div><div class="value" id="reps">--</div></div>
    <div class="metric"><div class="name">Peak</div><div class="value" id="peak">--</div></div>
    <div class="metric"><div class="name">Avg</div><div class="value" id="average">--</div></div>
    <div class="metric"><div class="name">Slowdown</div><div class="value" id="slowdown">--</div></div>
  </section>

  <section class="summary">
    <div class="metric"><div class="name">Max Drift</div><div class="value" id="maxDrift">--</div></div>
    <div class="metric"><div class="name">Avg Drift</div><div class="value" id="avgDrift">--</div></div>
    <div class="metric"><div class="name">ROM CV</div><div class="value" id="romCv">--</div></div>
    <div class="metric"><div class="name">Sticking</div><div class="value" id="sticking">--</div></div>
  </section>

  <section class="charts">
    <div class="chart-panel">
      <div class="chart-title">Velocity</div>
      <div class="chart" id="velocityChart">Load analysis JSON</div>
    </div>
    <div class="chart-panel">
      <div class="chart-title">Bar Path</div>
      <div class="chart" id="pathChart">Load analysis JSON</div>
    </div>
  </section>

  <section class="rep-list" id="repList"></section>
</main>

<script>
  const videoInput = document.getElementById("videoInput");
  const analysisInput = document.getElementById("analysisInput");
  const video = document.getElementById("video");
  const emptyStage = document.getElementById("emptyStage");
  const videoStage = document.getElementById("videoStage");
  const marker = document.getElementById("marker");
  const path = document.getElementById("path");
  const calibSvg = document.getElementById("calibSvg");
  const calibLine = document.getElementById("calibLine");
  const calibA = document.getElementById("calibA");
  const calibB = document.getElementById("calibB");
  const calibPickButton = document.getElementById("calibPickButton");
  const status = document.getElementById("status");
  const analyzeButton = document.getElementById("analyzeButton");
  const resetButton = document.getElementById("resetButton");
  const serviceUrl = document.getElementById("serviceUrl");
  const serviceCheckButton = document.getElementById("serviceCheckButton");
  const serviceStatus = document.getElementById("serviceStatus");
  const roiInput = document.getElementById("roiInput");
  const scaleInput = document.getElementById("scaleInput");
  const trackerSelect = document.getElementById("trackerSelect");
  const referencePxInput = document.getElementById("referencePxInput");
  const referenceMInput = document.getElementById("referenceMInput");
  const repList = document.getElementById("repList");
  const fileName = document.getElementById("fileName");
  const analysisName = document.getElementById("analysisName");
  const velocityChart = document.getElementById("velocityChart");
  const pathChart = document.getElementById("pathChart");

  let videoUrl = null;
  let calibrationActive = false;
  let calibPointA = null;
  let calibPointB = null;
  let repSegmentEnd = null;

  function clearRepSegmentPlayback() {
    if (repSegmentEnd !== null) {
      video.removeEventListener("timeupdate", onRepSegmentTimeUpdate);
      repSegmentEnd = null;
    }
  }

  function onRepSegmentTimeUpdate() {
    if (repSegmentEnd === null) return;
    if (video.currentTime >= repSegmentEnd) {
      const end = repSegmentEnd;
      clearRepSegmentPlayback();
      video.pause();
      try {
        video.currentTime = end;
      } catch (error) {
        // Some browsers reject seeking past the buffer; ignore.
      }
      status.textContent = "Rep paused";
    }
  }

  function isVideoReady() {
    return !video.hidden && !!video.src;
  }

  function jumpToRep(rep) {
    if (!isVideoReady()) {
      status.textContent = "No video loaded";
      return;
    }
    const start = Number(rep.start_time_s);
    if (!Number.isFinite(start)) {
      status.textContent = "Rep timing missing";
      return;
    }
    clearRepSegmentPlayback();
    try {
      video.currentTime = Math.max(0, start);
    } catch (error) {
      status.textContent = "Seek failed";
      return;
    }
    if (!video.paused) {
      video.pause();
    }
    status.textContent = `Rep ${formatCount(rep.index)} @ ${start.toFixed(2)}s`;
  }

  function playRepSegment(rep) {
    if (!isVideoReady()) {
      status.textContent = "No video loaded";
      return;
    }
    const start = Number(rep.start_time_s);
    const end = Number(rep.end_time_s);
    if (!Number.isFinite(start) || !Number.isFinite(end) || end <= start) {
      status.textContent = "Rep timing missing";
      return;
    }
    clearRepSegmentPlayback();
    try {
      video.currentTime = Math.max(0, start);
    } catch (error) {
      status.textContent = "Seek failed";
      return;
    }
    repSegmentEnd = end;
    video.addEventListener("timeupdate", onRepSegmentTimeUpdate);
    const playPromise = video.play();
    if (playPromise && typeof playPromise.catch === "function") {
      playPromise.catch(() => {
        clearRepSegmentPlayback();
        status.textContent = "Playback blocked";
      });
    }
    status.textContent = `Playing rep ${formatCount(rep.index)}`;
  }

  videoInput.addEventListener("change", () => {
    const file = videoInput.files[0];
    if (!file) return;
    if (videoUrl) URL.revokeObjectURL(videoUrl);
    videoUrl = URL.createObjectURL(file);
    fileName.textContent = file.name;
    clearRepSegmentPlayback();
    video.src = videoUrl;
    video.hidden = false;
    emptyStage.hidden = true;
    status.textContent = "Video loaded";
    refreshRepControlsState();
  });

  analysisInput.addEventListener("change", async () => {
    const file = analysisInput.files[0];
    if (!file) return;
    try {
      const payload = JSON.parse(await file.text());
      renderAnalysis(payload);
      analysisName.textContent = file.name;
      analysisName.classList.remove("error");
      status.textContent = "Analysis loaded";
    } catch (error) {
      analysisName.textContent = "Invalid JSON";
      analysisName.classList.add("error");
      status.textContent = "Analysis failed";
    }
  });

  videoStage.addEventListener("click", (event) => {
    const rect = videoStage.getBoundingClientRect();
    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;
    if (calibrationActive) {
      handleCalibrationClick(x, y);
      return;
    }
    marker.style.left = `${x}px`;
    marker.style.top = `${y}px`;
    marker.style.display = "block";
    path.style.left = `${x + 8}px`;
    path.style.display = "block";
    status.textContent = "Bar selected";
  });

  calibPickButton.addEventListener("click", () => {
    if (calibrationActive) {
      exitCalibrationMode();
    } else {
      enterCalibrationMode();
    }
  });

  serviceCheckButton.addEventListener("click", checkServiceHealth);

  analyzeButton.addEventListener("click", () => {
    if (isDemoMode()) {
      renderAnalysis(buildDemoPayload());
      status.textContent = "Analysis preview";
      return;
    }
    runServiceAnalysis();
  });

  function enterCalibrationMode() {
    calibrationActive = true;
    calibPointA = null;
    calibPointB = null;
    clearCalibrationHandles();
    videoStage.classList.add("calibrating");
    calibPickButton.textContent = "Cancel";
    status.textContent = "Calibration: tap point 1";
  }

  function exitCalibrationMode() {
    calibrationActive = false;
    calibPointA = null;
    calibPointB = null;
    clearCalibrationHandles();
    videoStage.classList.remove("calibrating");
    calibPickButton.textContent = "Pick Reference";
    status.textContent = "Calibration cancelled";
  }

  function handleCalibrationClick(x, y) {
    if (!calibPointA) {
      calibPointA = { x, y };
      showCalibPoint(calibA, x, y);
      status.textContent = "Calibration: tap point 2";
      return;
    }
    if (!calibPointB) {
      calibPointB = { x, y };
      showCalibPoint(calibB, x, y);
      drawCalibLine();
      const dx = calibPointB.x - calibPointA.x;
      const dy = calibPointB.y - calibPointA.y;
      const distance = Math.sqrt(dx * dx + dy * dy);
      referencePxInput.value = distance.toFixed(1);
      calibrationActive = false;
      videoStage.classList.remove("calibrating");
      calibPickButton.textContent = "Pick Reference";
      status.textContent = `Reference: ${distance.toFixed(1)} px`;
    }
  }

  function showCalibPoint(circle, x, y) {
    const rect = videoStage.getBoundingClientRect();
    circle.setAttribute("cx", String(x));
    circle.setAttribute("cy", String(y));
    circle.setAttribute("r", "7");
    circle.style.display = "";
    if (!calibSvg.style.display || calibSvg.style.display === "none") {
      calibSvg.setAttribute("viewBox", `0 0 ${rect.width} ${rect.height}`);
    }
    calibSvg.style.display = "block";
  }

  function drawCalibLine() {
    if (!calibPointA || !calibPointB) return;
    calibLine.setAttribute("x1", String(calibPointA.x));
    calibLine.setAttribute("y1", String(calibPointA.y));
    calibLine.setAttribute("x2", String(calibPointB.x));
    calibLine.setAttribute("y2", String(calibPointB.y));
    calibLine.style.display = "";
  }

  function clearCalibrationHandles() {
    calibA.style.display = "none";
    calibB.style.display = "none";
    calibLine.style.display = "none";
    calibA.setAttribute("cx", "0");
    calibA.setAttribute("cy", "0");
    calibB.setAttribute("cx", "0");
    calibB.setAttribute("cy", "0");
    calibLine.setAttribute("x1", "0");
    calibLine.setAttribute("y1", "0");
    calibLine.setAttribute("x2", "0");
    calibLine.setAttribute("y2", "0");
    calibSvg.style.display = "none";
  }

  window.addEventListener("resize", () => {
    if (calibSvg.style.display === "block") {
      const rect = videoStage.getBoundingClientRect();
      calibSvg.setAttribute("viewBox", `0 0 ${rect.width} ${rect.height}`);
    }
  });

  function buildDemoPayload() {
    return {
      summary: {
        rep_count: 5,
        max_speed_m_s: 0.82,
        avg_speed_m_s: 0.54
      },
      quality: {
        max_horizontal_drift_px: 18.4,
        avg_horizontal_drift_px: 9.2,
        rom_consistency_cv: 0.14,
        sticking_rep_index: 4,
        sticking_time_s: 8.35
      },
      frames: [0, 1, 2, 3, 4, 5, 6].map((step) => ({
        time_s: step * 0.2,
        speed_m_s: [0.1, 0.45, 0.62, 0.58, 0.38, 0.25, 0.2][step],
        center_x: [110, 112, 113, 116, 118, 119, 121][step],
        center_y: [230, 210, 185, 160, 150, 170, 205][step]
      })),
      reps: [0, 4, 9, 13, 18].map((loss, index) => {
        const start = 0.6 + index * 2.0;
        const end = start + 1.4;
        return {
          index: index + 1,
          start_time_s: start,
          end_time_s: end,
          mean_speed_m_s: 0.62 - index * 0.05,
          velocity_loss_pct: loss
        };
      })
    };
  }

  resetButton.addEventListener("click", () => {
    marker.style.display = "none";
    path.style.display = "none";
    calibrationActive = false;
    calibPointA = null;
    calibPointB = null;
    videoStage.classList.remove("calibrating");
    calibPickButton.textContent = "Pick Reference";
    clearCalibrationHandles();
    clearRepSegmentPlayback();
    clearRepList();
    clearCharts("Load analysis JSON");
    for (const id of ["reps", "peak", "average", "slowdown", "maxDrift", "avgDrift", "romCv", "sticking"]) {
      document.getElementById(id).textContent = "--";
    }
    referencePxInput.value = "";
    referenceMInput.value = "";
    status.textContent = video.hidden ? "Prototype" : "Video loaded";
  });

  if (isDemoMode()) {
    analyzeButton.click();
  }

  async function runServiceAnalysis() {
    const baseUrl = normalizeServiceUrl(serviceUrl.value);
    const roi = roiInput.value.trim();
    const scale = scaleInput.value.trim();
    const referencePx = referencePxInput.value.trim();
    const referenceM = referenceMInput.value.trim();
    const tracker = trackerSelect.value || "mosse";
    const file = videoInput.files[0];

    if (!file) {
      analysisName.textContent = "No video selected";
      analysisName.classList.add("error");
      status.textContent = "Analysis failed";
      return;
    }
    if (!baseUrl) {
      serviceStatus.textContent = "Service URL missing";
      serviceStatus.classList.add("error");
      status.textContent = "Analysis failed";
      return;
    }
    if (!roi) {
      serviceStatus.textContent = "ROI missing";
      serviceStatus.classList.add("error");
      status.textContent = "Analysis failed";
      return;
    }
    if (!isValidRoi(roi)) {
      serviceStatus.textContent = "Invalid ROI";
      serviceStatus.classList.add("error");
      status.textContent = "Analysis failed";
      return;
    }
    if (scale && !isPositiveNumber(scale)) {
      serviceStatus.textContent = "Invalid scale";
      serviceStatus.classList.add("error");
      status.textContent = "Analysis failed";
      return;
    }
    if (referencePx && !isPositiveNumber(referencePx)) {
      serviceStatus.textContent = "Invalid reference px";
      serviceStatus.classList.add("error");
      status.textContent = "Analysis failed";
      return;
    }
    if (referenceM && !isPositiveNumber(referenceM)) {
      serviceStatus.textContent = "Invalid reference m";
      serviceStatus.classList.add("error");
      status.textContent = "Analysis failed";
      return;
    }
    if ((referencePx && !referenceM) || (!referencePx && referenceM)) {
      serviceStatus.textContent = "Reference px and m must both be set";
      serviceStatus.classList.add("error");
      status.textContent = "Analysis failed";
      return;
    }

    const formData = new FormData();
    formData.append("video", file);
    formData.append("roi", roi);
    formData.append("tracker", tracker);
    if (scale) {
      formData.append("scale_px_per_meter", scale);
    }
    if (referencePx && referenceM) {
      formData.append("reference_px", referencePx);
      formData.append("reference_m", referenceM);
    }

    analyzeButton.disabled = true;
    status.textContent = "Queued";
    analysisName.textContent = "Uploading";
    analysisName.classList.remove("error");
    serviceStatus.classList.remove("error");
    try {
      const submitResponse = await fetch(`${baseUrl}/jobs`, {
        method: "POST",
        body: formData
      });
      if (!submitResponse.ok) {
        throw new Error(`HTTP ${submitResponse.status}`);
      }
      const job = await submitResponse.json();
      analysisName.textContent = "Queued";
      status.textContent = "Analyzing";
      const completeJob = await pollAnalysisJob(baseUrl, job.job_id);
      if (completeJob.status === "failed") {
        throw new Error(completeJob.error || "Analysis failed");
      }
      const resultResponse = await fetch(`${baseUrl}/jobs/${completeJob.job_id}/result`, {
        headers: { Accept: "application/json" }
      });
      if (!resultResponse.ok) {
        throw new Error(`HTTP ${resultResponse.status}`);
      }
      const payload = await resultResponse.json();
      renderAnalysis(payload);
      analysisName.textContent = "Service response";
      status.textContent = "Analysis complete";
      await loadAnnotatedVideo(baseUrl, completeJob.job_id);
    } catch (error) {
      analysisName.textContent = "Service error";
      analysisName.classList.add("error");
      status.textContent = "Analysis failed";
    } finally {
      analyzeButton.disabled = false;
    }
  }

  async function loadAnnotatedVideo(baseUrl, jobId) {
    const annotatedUrl = `${baseUrl}/jobs/${jobId}/video`;
    try {
      const probe = await fetch(annotatedUrl, { method: "HEAD" });
      if (!probe.ok) {
        status.textContent = probe.status === 409
          ? "Annotated video not ready"
          : probe.status === 410
            ? "Annotated video expired"
            : `Annotated video unavailable (HTTP ${probe.status})`;
        return;
      }
    } catch (error) {
      status.textContent = "Annotated video unavailable";
      return;
    }
    video.src = annotatedUrl;
    video.hidden = false;
    emptyStage.hidden = true;
    clearRepSegmentPlayback();
    video.load();
    status.textContent = "Annotated video ready";
    refreshRepControlsState();
  }

  async function pollAnalysisJob(baseUrl, jobId) {
    for (let attempt = 0; attempt < 120; attempt += 1) {
      const response = await fetch(`${baseUrl}/jobs/${jobId}`, {
        headers: { Accept: "application/json" }
      });
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }
      const payload = await response.json();
      serviceStatus.textContent = `Job ${payload.status}`;
      if (payload.status === "complete" || payload.status === "failed") {
        return payload;
      }
      await delay(1500);
    }
    throw new Error("Analysis timed out");
  }

  function delay(ms) {
    return new Promise((resolve) => setTimeout(resolve, ms));
  }

  async function checkServiceHealth() {
    const baseUrl = normalizeServiceUrl(serviceUrl.value);
    if (!baseUrl) {
      serviceStatus.textContent = "Service URL missing";
      serviceStatus.classList.add("error");
      status.textContent = "Service failed";
      return;
    }

    serviceStatus.textContent = "Checking";
    serviceStatus.classList.remove("error");
    status.textContent = "Checking service";
    try {
      const response = await fetch(`${baseUrl}/health`, {
        headers: { Accept: "application/json" }
      });
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }
      serviceStatus.textContent = "Service ok";
      status.textContent = "Service ok";
    } catch (error) {
      serviceStatus.textContent = "Service failed";
      serviceStatus.classList.add("error");
      status.textContent = "Service failed";
    }
  }

  function normalizeServiceUrl(value) {
    return value.trim().replace(/\/+$/, "");
  }

  function isValidRoi(value) {
    const parts = value.split(",").map((part) => part.trim());
    if (parts.length !== 4) {
      return false;
    }
    const numbers = parts.map((part) => Number(part));
    return numbers.every((number) => Number.isInteger(number)) && numbers[2] > 0 && numbers[3] > 0;
  }

  function isPositiveNumber(value) {
    const number = Number(value);
    return Number.isFinite(number) && number > 0;
  }

  function isDemoMode() {
    return new URLSearchParams(window.location.search).get("demo") === "1";
  }

  function renderAnalysis(payload) {
    const summary = payload.summary || {};
    const reps = Array.isArray(payload.reps) ? payload.reps : [];
    const frames = Array.isArray(payload.frames) ? payload.frames : [];
    const velocityLoss = reps
      .map((rep) => Number(rep.velocity_loss_pct))
      .filter((value) => Number.isFinite(value));
    const maxLoss = velocityLoss.length ? Math.max(...velocityLoss) : null;

    document.getElementById("reps").textContent = formatCount(summary.rep_count ?? reps.length);
    document.getElementById("peak").textContent = formatSpeed(summary.max_speed_m_s, summary.max_speed_px_s);
    document.getElementById("average").textContent = formatSpeed(summary.avg_speed_m_s, summary.avg_speed_px_s);
    document.getElementById("slowdown").textContent = formatPercent(maxLoss);
    renderQuality(payload.quality || {});
    renderReps(reps);
    renderCharts(frames);
  }

  function renderQuality(quality) {
    document.getElementById("maxDrift").textContent = formatPixels(quality.max_horizontal_drift_px);
    document.getElementById("avgDrift").textContent = formatPixels(quality.avg_horizontal_drift_px);
    document.getElementById("romCv").textContent = formatRatioPercent(quality.rom_consistency_cv);
    document.getElementById("sticking").textContent = formatSticking(quality);
  }

  function renderReps(reps) {
    clearRepList();
    for (const rep of reps) {
      const loss = Number(rep.velocity_loss_pct);
      const displayLoss = Number.isFinite(loss) ? loss : 0;
      const fill = Math.max(30, 100 - displayLoss * 3);
      const row = document.createElement("div");
      row.className = "rep";

      const title = document.createElement("strong");
      title.textContent = `Rep ${formatCount(rep.index)}`;

      const bar = document.createElement("div");
      bar.className = "bar";
      const fillEl = document.createElement("div");
      fillEl.className = "fill";
      fillEl.style.width = `${fill}%`;
      bar.appendChild(fillEl);

      const end = document.createElement("div");
      end.className = "rep-end";

      const lossEl = document.createElement("div");
      lossEl.className = "loss";
      lossEl.textContent = formatPercent(rep.velocity_loss_pct);
      end.appendChild(lossEl);

      const hasTiming = repHasTiming(rep);
      const ready = isVideoReady() && hasTiming;

      const jumpButton = document.createElement("button");
      jumpButton.type = "button";
      jumpButton.className = "rep-control secondary";
      jumpButton.dataset.action = "jump";
      jumpButton.dataset.hasTiming = hasTiming ? "1" : "0";
      jumpButton.setAttribute("aria-label", `Jump to rep ${formatCount(rep.index)}`);
      jumpButton.title = hasTiming ? "Jump to rep" : "Rep timing unavailable";
      jumpButton.textContent = "⤴";
      jumpButton.disabled = !ready;
      jumpButton.addEventListener("click", () => jumpToRep(rep));

      const playButton = document.createElement("button");
      playButton.type = "button";
      playButton.className = "rep-control";
      playButton.dataset.action = "play";
      playButton.dataset.hasTiming = hasTiming ? "1" : "0";
      playButton.setAttribute("aria-label", `Play rep ${formatCount(rep.index)}`);
      playButton.title = hasTiming ? "Play rep segment" : "Rep timing unavailable";
      playButton.textContent = "▶";
      playButton.disabled = !ready;
      playButton.addEventListener("click", () => playRepSegment(rep));

      end.append(jumpButton, playButton);
      row.append(title, bar, end);
      repList.appendChild(row);
    }
  }

  function repHasTiming(rep) {
    const start = Number(rep.start_time_s);
    const end = Number(rep.end_time_s);
    return Number.isFinite(start) && Number.isFinite(end) && end > start;
  }

  function refreshRepControlsState() {
    const buttons = repList.querySelectorAll(".rep-control");
    for (const button of buttons) {
      button.disabled = !isVideoReady() || button.dataset.hasTiming !== "1";
    }
  }

  function clearRepList() {
    while (repList.firstChild) {
      repList.removeChild(repList.firstChild);
    }
  }

  function renderCharts(frames) {
    const velocityPoints = frames
      .map((frame) => [Number(frame.time_s), Number(frame.speed_m_s ?? frame.speed_px_s)])
      .filter(([x, y]) => Number.isFinite(x) && Number.isFinite(y));
    const pathPoints = frames
      .map((frame) => [Number(frame.center_x), Number(frame.center_y)])
      .filter(([x, y]) => Number.isFinite(x) && Number.isFinite(y));

    renderLineChart(velocityChart, velocityPoints, "No velocity data", "var(--blue)", true);
    renderLineChart(pathChart, pathPoints, "No bar path data", "var(--red)", false);
  }

  function renderLineChart(container, points, emptyLabel, stroke, invertY) {
    clearElement(container);
    if (points.length < 2) {
      container.textContent = emptyLabel;
      return;
    }

    const width = 320;
    const height = 120;
    const padding = 10;
    const xs = points.map(([x]) => x);
    const ys = points.map(([, y]) => y);
    const minX = Math.min(...xs);
    const maxX = Math.max(...xs);
    const minY = Math.min(...ys);
    const maxY = Math.max(...ys);
    const xRange = Math.max(maxX - minX, 1);
    const yRange = Math.max(maxY - minY, 1);
    const scaledPoints = points.map(([x, y]) => {
      const scaledX = padding + ((x - minX) / xRange) * (width - padding * 2);
      let yPosition = (y - minY) / yRange;
      if (invertY) yPosition = 1 - yPosition;
      const scaledY = padding + yPosition * (height - padding * 2);
      return `${scaledX.toFixed(1)},${scaledY.toFixed(1)}`;
    });

    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
    svg.setAttribute("role", "img");
    const polyline = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
    polyline.setAttribute("points", scaledPoints.join(" "));
    polyline.setAttribute("fill", "none");
    polyline.setAttribute("stroke", stroke);
    polyline.setAttribute("stroke-width", "3");
    polyline.setAttribute("stroke-linecap", "round");
    polyline.setAttribute("stroke-linejoin", "round");
    svg.appendChild(polyline);
    container.appendChild(svg);
  }

  function clearCharts(label) {
    for (const chart of [velocityChart, pathChart]) {
      clearElement(chart);
      chart.textContent = label;
    }
  }

  function clearElement(element) {
    while (element.firstChild) {
      element.removeChild(element.firstChild);
    }
  }

  function formatCount(value) {
    return Number.isFinite(Number(value)) ? String(Number(value)) : "--";
  }

  function formatPercent(value) {
    return Number.isFinite(Number(value)) ? `${Number(value).toFixed(0)}%` : "--";
  }

  function formatRatioPercent(value) {
    return Number.isFinite(Number(value)) ? `${(Number(value) * 100).toFixed(1)}%` : "--";
  }

  function formatPixels(value) {
    return Number.isFinite(Number(value)) ? `${Number(value).toFixed(1)} px` : "--";
  }

  function formatSticking(quality) {
    if (quality.sticking_rep_index == null || quality.sticking_time_s == null) {
      return "--";
    }
    const repIndex = Number(quality.sticking_rep_index);
    const time = Number(quality.sticking_time_s);
    if (!Number.isFinite(repIndex) || !Number.isFinite(time)) {
      return "--";
    }
    return `Rep ${repIndex} @ ${time.toFixed(2)}s`;
  }

  function formatSpeed(metersPerSecond, pixelsPerSecond) {
    if (Number.isFinite(Number(metersPerSecond))) {
      return Number(metersPerSecond).toFixed(2);
    }
    if (Number.isFinite(Number(pixelsPerSecond))) {
      return Number(pixelsPerSecond).toFixed(0);
    }
    return "--";
  }
</script>
